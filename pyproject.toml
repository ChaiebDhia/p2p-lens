[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "p2p-lens"
version = "1.0.0"
description = "Procure-to-pay process intelligence on SAP-style data: process mining, conformance, a value model, and a grounded Q&A copilot."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dhia Chaieb" }]
keywords = ["process-mining", "sap", "procure-to-pay", "conformance-checking", "rag", "llm-evaluation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
  "types-defusedxml",
  "hypothesis>=6.100",
  "build>=1.2",
]

[project.scripts]
p2p-lens = "p2p_lens.cli:main"

[project.urls]
Homepage = "https://github.com/ChaiebDhia/p2p-lens"
Issues = "https://github.com/ChaiebDhia/p2p-lens/issues"
Changelog = "https://github.com/ChaiebDhia/p2p-lens/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_lens"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=p2p_lens --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = []
